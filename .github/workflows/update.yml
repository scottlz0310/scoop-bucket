name: Update Manifests

# 毎日 1 回、Scoop 標準の checkver / autoupdate でマニフェストの新バージョンを確認し、
# 更新があれば Bot（GitHub App）名義で更新 PR を作る。main への直接 push は ruleset で禁止されているため、
# 更新は必ず PR になり、マージは人が行う。
# 即時に反映したいときは、Actions の「Run workflow」（workflow_dispatch）から手動で起動する。
# pull_request では checkver の確認だけを行い、PR や Issue は作らない（workflow / マニフェスト変更の検証用）。
#
# 失敗の扱い: マニフェストごとに独立して実行し、1 つが失敗しても他の更新を巻き込まない（check-manifests.ps1）。
# 失敗したマニフェストは、report ジョブが Issue で通知し、復旧すると自動で閉じる。実行自体も失敗にする。
# checkver を実行する update ジョブには書き込み権限を持たせず、結果の JSON だけを受け取る report ジョブに分ける
# （Scoop 本体やマニフェストの checkver スクリプトを実行する間に、Issue や workflow を操作できる権限を持たないため）。

on:
  schedule:
    - cron: "17 3 * * *"
  repository_dispatch:
    types: [release-published]
  workflow_dispatch:
    inputs:
      manifest:
        description: '更新するマニフェスト名（省略時は全件）'
        required: false
        type: string
        default: ''
  pull_request:

permissions: {}

concurrency:
  group: >-
    ${{
      github.event_name == 'pull_request' && format('update-manifests-pr-{0}', github.event.number)
      || format('update-manifests-{0}', (github.event_name == 'repository_dispatch' && github.event.client_payload.manifest) || inputs.manifest || 'all')
    }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  update:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout bucket
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ fromJSON(github.event_name == 'pull_request' && '0' || '1') }}
          persist-credentials: false

      - name: Resolve target manifest
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_MANIFEST: ${{ github.event.client_payload.manifest }}
          INPUT_MANIFEST: ${{ inputs.manifest }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == 'pull_request' ]]; then
            git cat-file -e "${BASE_SHA}^{commit}"
            diff_rc=0
            git diff --quiet "$BASE_SHA" HEAD -- .github/workflows/update.yml .github/scripts .github/actions/setup-scoop bucket || diff_rc=$?
            if [[ "$diff_rc" -eq 0 ]]; then
              echo "更新スクリプト・マニフェストに変更が無いため、update チェックを省略する"
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              echo "manifest=" >> "$GITHUB_OUTPUT"
              exit 0
            elif [[ "$diff_rc" -ne 1 ]]; then
              echo "::error::git diff failed with exit code $diff_rc"
              exit "$diff_rc"
            fi
          fi
          echo "should_run=true" >> "$GITHUB_OUTPUT"
          manifest=''
          if [[ "$EVENT_NAME" == 'repository_dispatch' ]]; then
            manifest=$DISPATCH_MANIFEST
          elif [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            manifest=$INPUT_MANIFEST
          fi
          if [[ -n "$manifest" ]]; then
            if [[ "$manifest" == *..* || ! "$manifest" =~ ^[a-z0-9]([a-z0-9._-]*[a-z0-9])?$ ]]; then
              echo "::error::Invalid manifest name: '$manifest'"
              exit 1
            fi
            if [[ ! -f "bucket/${manifest}.json" ]]; then
              echo "::error::Manifest not found: bucket/${manifest}.json"
              exit 1
            fi
          fi
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"

      # checkver.ps1 は Scoop 本体のライブラリを使う。SHA 固定は verify.yml と共通の action に置く。
      - if: steps.target.outputs.should_run == 'true'
        uses: ./.github/actions/setup-scoop

      - name: Check and update manifests
        if: steps.target.outputs.should_run == 'true'
        shell: pwsh
        env:
          TARGET_MANIFEST: ${{ steps.target.outputs.manifest }}
        run: |
          $params = @{
            ScoopRoot  = './scoop'
            ResultPath = "$env:RUNNER_TEMP/check-result.json"
          }
          if ($env:TARGET_MANIFEST) { $params.Manifest = $env:TARGET_MANIFEST }
          ./.github/scripts/check-manifests.ps1 @params

      - name: Upload check result
        if: ${{ !cancelled() && steps.target.outputs.should_run == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-result
          path: ${{ runner.temp }}/check-result.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Detect changes
        id: changes
        if: steps.target.outputs.should_run == 'true'
        shell: bash
        run: |
          if git diff --quiet -- bucket; then
            echo "更新はありません"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git --no-pager diff -- bucket
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # checkver の実行後に発行する（Scoop 本体の実行中に書き込み権限つきトークンを持たないため）。
      - name: Generate GitHub App Token
        id: app_token
        if: steps.changes.outputs.changed == 'true' && github.event_name != 'pull_request'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - name: Open update pull request
        if: steps.changes.outputs.changed == 'true' && github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          APP_SLUG: ${{ steps.app_token.outputs.app-slug }}
          REPOSITORY: ${{ github.repository }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash .github/scripts/open-update-prs.sh

      # 成功したマニフェストの更新 PR を先に作ってから、失敗があれば実行を失敗にする
      - name: Fail if any manifest failed
        if: steps.target.outputs.should_run == 'true'
        shell: pwsh
        run: |
          $results = @(Get-Content "$env:RUNNER_TEMP/check-result.json" -Raw | ConvertFrom-Json)
          $failed = @($results | Where-Object { -not $_.ok })
          foreach ($f in $failed) { Write-Host "::error title=$($f.name)::更新の確認に失敗した" }
          if ($failed.Count -gt 0) { exit 1 }

  report:
    needs: update
    # update が失敗しても（失敗の通知のために）実行する。pull_request では Issue を作らない。
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.update.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download check result
        id: download
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: check-result
          path: ${{ runner.temp }}/check-result

      # 結果が無い（update ジョブが結果を出す前に失敗した）ときは、通知しない。実行の失敗自体が通知になる。
      - name: Notify failures
        if: steps.download.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/notify-failures.sh "$RUNNER_TEMP/check-result/check-result.json" update

      # scheduled workflow は、リポジトリに 60 日間活動が無いと GitHub に無効化される。
      # 有効化の API を毎回呼んで、無効化を避ける（効果は未検証。失敗しても通知や更新には影響させない）。
      - name: Keep schedule enabled
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: gh workflow enable update.yml --repo "$REPOSITORY"
